# order: Deployment (pods + probes + resource limits) and Service (stable DNS name)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: shop
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: order:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "0.1.0"
            - name: INVENTORY_URL
              value: http://inventory:8000
            - name: NOTIFICATION_URL
              value: http://notification:8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: shop
spec:
  selector:
    app: order
  ports:
    - port: 8000
      targetPort: 8000